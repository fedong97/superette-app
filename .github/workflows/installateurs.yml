# Installateurs Windows : ONIX 360 (caisse) et ONIX 360 Serveur, construits sur Windows
# à chaque demande de fusion ou à la demande (Actions › Installateurs › Run workflow).
# L'application Android ONIX 360 Mobile (.apk) est construite sur Linux.
# Les fichiers .exe et .apk se téléchargent dans l'onglet « Summary » de l'exécution (Artifacts).
name: Installateurs

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: installateurs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Installateurs Windows
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Notifications Android : un seul projet Firebase pour toutes les boutiques (secrets du dépôt).
      - name: Réglages Firebase
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_GOOGLE_SERVICES: ${{ secrets.FIREBASE_GOOGLE_SERVICES }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ] && [ -n "$FIREBASE_GOOGLE_SERVICES" ]; then
            node -e "require('fs').writeFileSync('apps/server/src/firebase.defaults.json', JSON.stringify({ serviceAccount: JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT), googleServices: JSON.parse(process.env.FIREBASE_GOOGLE_SERVICES) }))"
            echo "Notifications : réglages Firebase inclus"
          else
            echo "Notifications : pas de secrets FIREBASE_*, à coller sur la page Téléphones"
          fi
      - name: ONIX 360
        working-directory: apps/desktop
        run: npx electron-vite build && npx electron-builder --win --x64 --publish never
      - name: ONIX 360 Serveur
        working-directory: apps/server-app
        run: npm run build && npx electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: ONIX-360-installateurs
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/latest.yml
            apps/server-app/release/*.exe
          if-no-files-found: error
          retention-days: 30

  android:
    name: Application Android ONIX 360 Mobile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Pages de l'application
        working-directory: apps/inventory
        run: npx vite build && npx cap sync android
      # Clé de signature gardée dans les secrets du dépôt, si elle y est ; sinon celle du dépôt.
      - name: Clé de signature
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/fedonix.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/fedonix.jks" >> "$GITHUB_ENV"
          fi
      - name: APK
        working-directory: apps/inventory/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          version=$(node -p "require('../../../package.json').version")
          mkdir -p ../release
          cp app/build/outputs/apk/release/app-release.apk "../release/Onix360-Mobile-$version.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: ONIX-360-Mobile-android
          path: apps/inventory/release/*.apk
          if-no-files-found: error
          retention-days: 30

  serveur-internet:
    name: Serveur sur internet (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Notifications Android : un seul projet Firebase pour toutes les boutiques (secrets du dépôt).
      - name: Réglages Firebase
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_GOOGLE_SERVICES: ${{ secrets.FIREBASE_GOOGLE_SERVICES }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ] && [ -n "$FIREBASE_GOOGLE_SERVICES" ]; then
            node -e "require('fs').writeFileSync('apps/server/src/firebase.defaults.json', JSON.stringify({ serviceAccount: JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT), googleServices: JSON.parse(process.env.FIREBASE_GOOGLE_SERVICES) }))"
            echo "Notifications : réglages Firebase inclus"
          else
            echo "Notifications : pas de secrets FIREBASE_*, à coller sur la page Téléphones"
          fi
      - name: Image du serveur
        run: |
          version=$(node -p "require('./package.json').version")
          echo "VERSION=$version" >> "$GITHUB_ENV"
          docker build -f deploy/Dockerfile -t "fedonix360-serveur:$version" .
      - name: Essai de l'image
        run: |
          docker run -d --name essai -p 3000:3000 -e ADMIN_PASSWORD=essai-du-serveur "fedonix360-serveur:$VERSION"
          for i in $(seq 1 30); do curl -fs http://localhost:3000/ >/dev/null && break; sleep 1; done
          curl -fs http://localhost:3000/gerant >/dev/null
          docker rm -f essai
      - name: Paquet à copier sur le serveur
        run: |
          dir="ONIX-360-serveur-internet-$VERSION"
          mkdir "$dir"
          cp deploy/docker-compose.yml deploy/Caddyfile deploy/installer.sh deploy/env.exemple docs/serveur-internet.md "$dir/"
          docker save "fedonix360-serveur:$VERSION" | gzip > "$dir/fedonix360-serveur-$VERSION.tar.gz"
          echo "DIR=$dir" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DIR }}
          path: ${{ env.DIR }}
          if-no-files-found: error
          retention-days: 30
