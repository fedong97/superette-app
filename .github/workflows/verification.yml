# Vérification automatique : à chaque envoi sur main et à chaque demande de fusion,
# les tests (sur SQLite, et le serveur sur PostgreSQL) et la vérification des types tournent.
name: Vérification

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests et types
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: superette
          POSTGRES_PASSWORD: superette
          POSTGRES_DB: superette_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U superette"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Electron n'est pas lancé ici : inutile de télécharger son binaire.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Vérification des types
        run: npm run typecheck
      - name: Tests (SQLite et base intégrée du serveur)
        run: npm test
      - name: Tests du serveur sur PostgreSQL
        run: npx vitest run apps/server
        env:
          TEST_DATABASE_URL: postgres://superette:superette@localhost:5432/superette_test
      - name: Construction de l'application
        run: npm run build -w @superette/desktop

  ecrans:
    name: Écrans (application lancée)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Base locale compilée pour Electron
        run: npm run rebuild:electron -w @superette/desktop
      - name: Écran virtuel
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Tests des écrans (connexion, menus, caisse)
        run: xvfb-run -a npm run test:ecrans
      - name: Captures en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ecrans-echec
          path: test-results/ecrans
