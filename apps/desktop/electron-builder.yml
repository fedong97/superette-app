appId: cm.superette.gestion
productName: FEDONIX 360
copyright: © FEDONG
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asarUnpack:
  - '**/*.node'
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: Fedonix360-Setup-${version}.exe
nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: FEDONIX 360
  language: '1036'
  # Contrat de licence à accepter pendant l'installation (aussi affiché dans Administration › Licence).
  license: build/contrat-licence.txt
# Mise à jour automatique : l'adresse réelle est choisie au lancement (serveur central
# du PC, /mises-a-jour/, ou adresse saisie dans Administration › Mises à jour).
# Celle-ci ne sert que de valeur de repli dans app-update.yml.
publish:
  provider: generic
  url: https://mises-a-jour.example.cm/superette/
