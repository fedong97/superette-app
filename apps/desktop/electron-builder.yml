appId: cm.superette.gestion
productName: FEDONIX 360
copyright: © FEDONG
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asarUnpack:
  - '**/*.node'
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: Fedonix360-Setup-${version}.exe
nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: FEDONIX 360
  language: '1036'
  # Contrat de licence à accepter pendant l'installation (aussi affiché dans Administration › Licence).
  license: build/contrat-licence.txt
# Mise à jour automatique : les nouvelles versions (.exe + latest.yml) sont
# déposées sur le serveur central ; chaque poste vérifie au démarrage.
publish:
  provider: generic
  url: https://mises-a-jour.example.cm/superette/
