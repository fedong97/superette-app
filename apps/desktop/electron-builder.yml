appId: cm.superette.gestion
productName: FEDO Gestion
copyright: © FEDONG
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asarUnpack:
  - '**/*.node'
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: FedoGestion-Setup-${version}.exe
nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: FEDO Gestion
  language: '1036'
# Mise à jour automatique : les nouvelles versions (.exe + latest.yml) sont
# déposées sur le serveur central ; chaque poste vérifie au démarrage.
publish:
  provider: generic
  url: https://mises-a-jour.example.cm/superette/
