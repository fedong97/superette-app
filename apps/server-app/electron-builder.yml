appId: cm.superette.serveur
productName: ONIX 360 Serveur
copyright: © FEDONG
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
# PGlite lit sa base (fichiers .wasm et .data) depuis son dossier : hors de l'archive asar.
asarUnpack:
  - '**/node_modules/@electric-sql/pglite/**'
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: Onix360-Serveur-Setup-${version}.exe
nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: ONIX 360 Serveur
  language: '1036'
  runAfterFinish: true
  # Ouvre le pare-feu Windows pour que les autres PC joignent le serveur.
  include: build/installer.nsh
publish: null
